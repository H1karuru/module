name: 波点音乐
description: 解锁波点音乐会员、下载功能以及付费专辑，移除开屏广告、横幅推广、悬浮广告以及商城Tab，建议卸载重装使用。
author: WeiGiegie[https://github.com/WeiGiegie],可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md],ZenmoFeiShi[https://github.com/ZenmoFeiShi],wish[https://github.com/mist-whisper]
dns: {}
rewrites:
- match: ^https://ad\.tencentmusic\.com/config/uni
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: ^https:\/\/bd-api\.kuwo\.cn\/api\/(play|service|advert)\/advert\/
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: ^https:\/\/bd-api\.kuwo\.cn\/api\/popup\/
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: ^https:\/\/bd-api\.kuwo\.cn\/api\/pay\/vip\/invitation\/assist\/popup\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: ^https:\/\/bd-api\.kuwo\.cn\/api\/service\/banner\/
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: ^https:\/\/bd-api\.kuwo\.cn\/api\/service\/home\/module\?.*&moduleId=6
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: ^https:\/\/bd-api\.kuwo\.cn\/api\/pay\/vip\/lowPriceText\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: ^https:\/\/bd-api\.kuwo\.cn\/api\/service\/global\/config\/vipEnter\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: ^https:\/\/bd-api\.kuwo\.cn\/api\/ucenter\/vip\/give\/config\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: ^https:\/\/bd-api\.kuwo\.cn\/api\/search\/topic\/word
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: ^https:\/\/bd-api\.kuwo\.cn\/api\/service\/global\/config\/scene
  actions:
  - response_body:
      jq: .data.showShopEntry=false | .data.idolTabShow=true | .
- match: ^https:\/\/bd-api\.kuwo\.cn\/api\/service\/home\/index
  actions:
  - response_body:
      jq: .data.moduleList |= (if type=="array" then map(select(.type != 8 and .type != 5 and .type != 1 and .type != 9 and .type != 6 and .type != 4)) else . end)
- match: ^https:\/\/bd-api\.kuwo\.cn\/api\/service\/resource\/recommend\?
  actions:
  - response_body:
      jq: if .data.resourceList then .data.resourceList |= map(del(.resource)) else . end
- match: ^https:\/\/bd-api\.kuwo\.cn\/api\/comments\/v3\/topInfo
  actions:
  - response_body:
      jq: if .data then del(.data.putao) else . end
- match: ^https:\/\/bd-api\.kuwo\.cn\/api\/voice\/room\/v2\/sidebar
  actions:
  - response_body:
      jq: .data = {}
scriptings:
- http_response:
    name: 波点音乐
    match: ^https?:\/\/(?:(?:bd-api|h5app|bodianyin|ab-bodian)\.kuwo\.cn\/(?:api\/(?:ucenter\/users\/(?:pub|login)|play\/(?:music\/v2\/(?:audioUrl|checkRight)|advert\/info)|service\/(?:music\/(?:info|download\/(?:info|config))|home\/module|global\/config\/(?:scene|vipEnter)|banner\/positions|advert\/config)|search\/topic\/word\/list|pay\/(?:vip\/(?:invitation\/(?:assist\/popup|swell)|lowPriceText)|sp\/actVip|audition\/url)|advert\/free\/config|popup\/start\/info|abtest\/ui\/info|rec\/feed)|abtest\/ui\/info)|us\.l\.qq\.com\/exapp|xs\.gdt\.qq\.com\/style_factory\/template_list)
    script_url: https://resource.wuyra.com/Script/BodianMusic/BodianMusic.js
    timeout: 60
    body_required: true
mitm:
  hostnames:
    includes:
    - bd-api.kuwo.cn
    - '*.kuwo.*'
    - ad.tencentmusic.com
    - '*.l.qq.com'
