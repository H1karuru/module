name: 插件模块跳转
description: 可莉、qingr、Kelvin Lab 的安装入口跳转 Egern
icon: https://iili.io/BDPVJ1I.png
homepage: https://hub.kelee.one
body_rewrites:
  - response_regex:
      match: ^https://(pluginhub|hub)\.kelee\.one/
      find: loon://import\?plugin=
      replace: egern:/modules/new?url=
  - response_regex:
      match: ^https://surge\.qingr\.moe/
      find: surge:///install-module\?url=
      replace: egern:/modules/new?url=
  - response_regex:
      match: ^https://kelvinlab\.wuyra\.com/script\.js(?:\?.*)?$
      find: 'url:\s*item\.surgeUrl\b'
      replace: 'url: "egern:/modules/new?url=" + encodeURIComponent(item.surgeUrl.split("?url=")[1])'
mitm:
  hostnames:
    includes:
      - pluginhub.kelee.one
      - hub.kelee.one
      - surge.qingr.moe
      - kelvinlab.wuyra.com
