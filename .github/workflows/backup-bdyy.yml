name: Backup bdyy.js
on:
  push:
    paths:
      - '.github/workflows/backup-bdyy.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify original script
        run: |
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/WeiGiegie/666/main/bdyy.js' -o bdyy.js
          test "$(git hash-object bdyy.js)" = 'db1b18b0c3df61e9207a7b733f412a9a89abe8de'
      - name: Commit backup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bdyy.js
          if ! git diff --cached --quiet; then
            git commit -m 'Back up original bdyy.js with verified blob SHA'
            git push origin HEAD:main
          fi
